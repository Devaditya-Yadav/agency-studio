<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="480" height="480" role="img" aria-label="LIID ESTUDIO Olive Badge Monogram">
  <title>LIID ESTUDIO — Primary Badge Monogram (Olive Essence)</title>
  <!-- Signature Olive Essence Badge Circle (#8B8563) -->
  <circle cx="120" cy="120" r="114" fill="#8B8563"/>
  <!-- LD. Bespoke Interlocking Serif Monogram in Porcelain Ivory (#F2EFE9) -->
  <g fill="#F2EFE9">
    <!-- Capital L: Top serif, Roman vertical stem, baseline arm, and upward right bracket spur -->
    <path d="M 73 56 H 93 V 58.6 H 87.6 V 137.4 H 126 C 132.5 137.4 135.4 133.5 137.2 123.5 H 139.6 L 138.4 140.2 H 73 V 137.6 H 79.8 V 58.6 H 73 Z"/>
    <!-- Capital D: Interrupted upper vertical stem + continuous high-contrast Roman crescent bowl + flat lower terminal -->
    <path d="M 99 84 H 124 C 151.5 84 169 101.8 169 126.5 C 169 151.8 150.2 169 122.5 169 H 99 V 166.3 H 121.5 C 145.2 166.3 160.2 150.2 160.2 126.5 C 160.2 102.6 145.4 86.7 122 86.7 H 111.2 V 131.5 H 103.6 V 86.7 H 99 Z"/>
    <!-- Signature Period Dot aligned beneath D's interrupted stem -->
    <circle cx="107.4" cy="151.5" r="3.6"/>
  </g>
</svg>
