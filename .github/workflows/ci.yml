name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Test, Security Hygiene & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PII, secrets & boilerplate hygiene check
        run: npm run check:pii

      - name: Run strict TypeScript check
        run: npm run typecheck

      - name: Run unit and API middleware tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify Docker image build
        run: docker build --no-cache -t agency-studio:ci .
